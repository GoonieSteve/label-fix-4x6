name: Windows Portable and Microsoft Store MSIX
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'store/partner-center-identity.json'
      - '.github/workflows/windows-portable-and-msix.yml'
      - 'scripts/build_msix.ps1'
      - 'setup_cxfreeze.py'
      - 'label_app.py'
      - 'label_core.py'
      - 'requirements.txt'
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies and test PDF conversion
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'cx_Freeze>=8,<9' pillow
          if ($LASTEXITCODE -ne 0) { throw 'Dependencies failed' }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }
      - name: Check official conch artwork
        shell: pwsh
        run: |
          python scripts/brand_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Branding SHA-256 mismatch' }
      - name: Compile and smoke test Windows EXE
        shell: pwsh
        run: |
          python setup_cxfreeze.py build_exe
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed' }
          if (!(Test-Path dist/LabelFix4x6/LabelFix4x6.exe)) { throw 'Missing exe' }
          foreach ($doc in @('README.md','LICENSE','THIRD_PARTY_NOTICES.md','PRIVACY.md','SECURITY.md','CHANGELOG.md')) { Copy-Item $doc dist/LabelFix4x6/ }
          $p=Start-Process -FilePath (Resolve-Path dist/LabelFix4x6/LabelFix4x6.exe).Path -PassThru
          Start-Sleep -Seconds 4
          $p.Refresh()
          if ($p.HasExited) { throw "GUI exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Build and verify MSIX against reserved Microsoft Store identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cfg=Get-Content './store/partner-center-identity.json' -Raw | ConvertFrom-Json
          $name=$cfg.package_identity_name.Trim()
          $publisher=$cfg.package_identity_publisher.Trim()
          $display=$cfg.publisher_display_name.Trim()
          $reservedName=$cfg.reserved_display_name.Trim()
          if ($name -ne 'KeysWebIT.LabelFix46') { throw 'Wrong reserved package identity name' }
          if ($publisher -ne 'CN=E5E5C985-5FC9-40EB-9B10-B74DF35E7FC1') { throw 'Wrong Store publisher DN' }
          if ($display -ne 'KeysWebIT') { throw 'Wrong reserved publisher display name' }
          if ($reservedName -cne 'LabelFix 4×6') { throw "Unexpected reserved name: $reservedName" }
          if ($cfg.store_id -ne '9NHZHC39HTZ4') { throw 'Wrong Store product ID' }
          if ($cfg.package_family_name -ne 'KeysWebIT.LabelFix46_j9nta6j9hbm8t') { throw 'Wrong package family name' }
          & './scripts/build_msix.ps1' -IdentityName $name -Publisher $publisher -PublisherDisplayName $display -PackageDisplayName $reservedName -Version $cfg.msix_version -StoreSubmission
          if ($LASTEXITCODE -ne 0) { throw 'MSIX packaging failed' }
          $packageFile=Join-Path 'dist' "LabelFix4x6-Store-$($cfg.msix_version)-UNSIGNED.msix"
          if (!(Test-Path $packageFile)) { throw "MSIX output missing: $packageFile" }
          $makeappx=Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\MakeAppx.exe" -ErrorAction Stop | Sort-Object FullName -Descending | Select-Object -First 1
          & $makeappx.FullName unpack /o /p $packageFile /d 'dist/msix-manifest-check'
          if ($LASTEXITCODE -ne 0) { throw 'MSIX unpack verification failed' }
          [xml]$manifest=Get-Content 'dist/msix-manifest-check/AppxManifest.xml' -Raw
          $idNode=$manifest.SelectSingleNode("/*[local-name()='Package']/*[local-name()='Identity']")
          $dispNode=$manifest.SelectSingleNode("/*[local-name()='Package']/*[local-name()='Properties']/*[local-name()='PublisherDisplayName']")
          $appNameNode=$manifest.SelectSingleNode("/*[local-name()='Package']/*[local-name()='Properties']/*[local-name()='DisplayName']")
          $visualNode=$manifest.SelectSingleNode("/*[local-name()='Package']/*[local-name()='Applications']/*[local-name()='Application']/*[local-name()='VisualElements']")
          if ($idNode.GetAttribute('Name') -cne $name -or $idNode.GetAttribute('Publisher') -cne $publisher -or $dispNode.InnerText -cne $display) {
            throw "Identity mismatch: $($idNode.GetAttribute('Name')) / $($idNode.GetAttribute('Publisher')) / $($dispNode.InnerText)"
          }
          if ($appNameNode.InnerText -cne $reservedName) { throw "MSIX app name mismatch: $($appNameNode.InnerText)" }
          if ($visualNode.GetAttribute('DisplayName') -cne $reservedName) { throw "MSIX tile name mismatch: $($visualNode.GetAttribute('DisplayName'))" }
          if ($idNode.GetAttribute('Version') -cne $cfg.msix_version) { throw 'Package version mismatch' }
          if (!(Test-Path 'dist/msix-manifest-check/LabelFix4x6.exe')) { throw 'No executable in built MSIX' }
          if (!(Test-Path 'dist/msix-manifest-check/Assets/StoreLogo.png')) { throw 'Store logo missing' }
          Write-Host 'Confirmed Partner Center identity:' $name $publisher $display
          Write-Host "Store ID: $($cfg.store_id) | PFN: $($cfg.package_family_name)"
          Get-FileHash $packageFile -Algorithm SHA256 | Format-List
          Write-Host 'Ready for Partner Center upload testing, UNSIGNED; not intended for direct download or sideload.'
      - name: Upload portable release candidate
        uses: actions/upload-artifact@v4
        with:
          name: LabelFix4x6-portable-x64-UNSIGNED
          path: dist/LabelFix4x6/
          if-no-files-found: error
      - name: Upload unsigned MSIX
        uses: actions/upload-artifact@v4
        with:
          name: LabelFix4x6-Store-MSIX-UNSIGNED
          path: dist/*.msix
          if-no-files-found: error
